<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recherche de train</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f4f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 16px; box-sizing: border-box; }
        .generator-card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 500px; box-sizing: border-box; }
        h1 { color: #005691; text-align: center; margin: 0 0 6px; }
        .subtitle { text-align: center; color: #666; font-size: 0.9em; margin: 0 0 20px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; font-size: 0.9em; }
        input, select { width: 100%; padding: 10px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 16px; box-sizing: border-box; transition: border 0.3s; }
        input:focus, select:focus { border-color: #005691; outline: none; }
        input.invalid { border-color: #d92321; }
        .row { display: flex; gap: 10px; }
        .row .input-group { flex: 1; }
        .btn-swap { display: block; margin: -5px auto 10px; background: none; border: 2px solid #e0e0e0; border-radius: 50%; width: 40px; height: 40px; font-size: 18px; cursor: pointer; color: #005691; }
        .btn-swap:hover { border-color: #005691; }
        .btn-generate { background: #005691; color: white; width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; transition: background 0.3s; margin-top: 10px; }
        .btn-generate:hover { background: #004070; }
        .btn-generate:disabled { background: #9bb5c9; cursor: not-allowed; }
        .btn-secondary { background: white; color: #005691; border: 2px solid #005691; }
        .btn-secondary:hover { background: #f0f8ff; }
        .error { color: #d92321; font-size: 0.9em; margin-top: 10px; text-align: center; min-height: 1.2em; }
        .result-display { margin-top: 25px; text-align: center; display: none; animation: fadeIn 0.5s; }
        .ticket-header { background: #f0f8ff; padding: 15px; border-radius: 8px; margin-bottom: 15px; text-align: left; }
        .ticket-header p { margin: 6px 0; }
        .price-tag { font-size: 1.4em; font-weight: bold; color: #d92321; }
        .loader { display: none; color: #005691; text-align: center; margin-top: 20px; font-weight: bold; }
        .hint { font-size: 0.85em; color: #666; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="generator-card">
    <h1>🚆 Recherche de train</h1>
    <p class="subtitle">Préparez votre trajet, puis réservez sur SNCF Connect</p>

    <div class="input-group">
        <label for="depart">Départ</label>
        <input type="text" id="depart" placeholder="Ex : Paris" list="villes" autocomplete="off" oninput="debounceVal('depart')">
    </div>

    <button class="btn-swap" type="button" onclick="swapCities()" title="Inverser départ et arrivée">⇅</button>

    <div class="input-group">
        <label for="arrivee">Arrivée</label>
        <input type="text" id="arrivee" placeholder="Ex : Lyon" list="villes" autocomplete="off" oninput="debounceVal('arrivee')">
    </div>

    <datalist id="villes">
        <option value="Paris">
        <option value="Lyon">
        <option value="Marseille">
        <option value="Lille">
        <option value="Bordeaux">
        <option value="Toulouse">
        <option value="Nantes">
        <option value="Strasbourg">
        <option value="Nice">
        <option value="Montpellier">
        <option value="Rennes">
        <option value="Villefranche-sur-Saône">
    </datalist>

    <div class="row">
        <div class="input-group">
            <label for="date">Date</label>
            <input type="date" id="date">
        </div>
        <div class="input-group">
            <label for="heure">Heure</label>
            <input type="time" id="heure" value="08:00">
        </div>
    </div>

    <div class="input-group">
        <label for="confort">Type de train</label>
        <select id="confort">
            <option value="Indifférent">Peu importe (le plus pratique)</option>
            <option value="TER / Intercités">Pas cher (TER / Intercités)</option>
            <option value="TGV INOUI / OUIGO">Le plus rapide (TGV INOUI / OUIGO)</option>
            <option value="Billet flexible">Plus cher mais échangeable (Flex)</option>
        </select>
    </div>

    <button class="btn-generate" id="btn-search" onclick="generateTicket()" disabled>Préparer mon trajet</button>
    <div class="error" id="error"></div>

    <div class="loader" id="loader">Recherche en cours...</div>

    <div class="result-display" id="result">
        <h3>Votre trajet :</h3>
        <div class="ticket-header">
            <p><strong>Départ :</strong> <span id="res-depart"></span></p>
            <p><strong>Arrivée :</strong> <span id="res-arrivee"></span></p>
            <p><strong>Quand :</strong> <span id="res-date"></span></p>
            <p><strong>Type :</strong> <span id="res-type"></span></p>
            <p><span class="price-tag" id="res-temps"></span></p>
        </div>
        <p class="hint">Le trajet est copié : sur SNCF Connect, collez-le ou retapez-le dans la recherche pour voir les horaires et les prix 😎</p>
        <button class="btn-generate" onclick="openSncf()">Voir les prix sur SNCF Connect</button>
        <button class="btn-generate btn-secondary" onclick="resetForm()">Nouvelle recherche</button>
    </div>
</div>

<script>
    const timers = {};

    // Met la date du jour par défaut et empêche de choisir une date passée
    (function initDate() {
        const now = new Date();
        const today = new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
        const dateInput = document.getElementById('date');
        dateInput.value = today;
        dateInput.min = today;
    })();

    // Attend que l'utilisateur arrête de taper avant de vérifier le formulaire
    function debounceVal(id) {
        clearTimeout(timers[id]);
        timers[id] = setTimeout(searchSmart, 300);
    }

    // Met une majuscule à chaque mot : "saint-étienne" -> "Saint-Étienne"
    function cleanCity(value) {
        return value
            .trim()
            .replace(/\s+/g, ' ')
            .toLowerCase()
            .replace(/(^|[\s-])(\p{L})/gu, (m, sep, letter) => sep + letter.toUpperCase());
    }

    function swapCities() {
        const depart = document.getElementById('depart');
        const arrivee = document.getElementById('arrivee');
        [depart.value, arrivee.value] = [arrivee.value, depart.value];
        searchSmart();
    }

    // Active le bouton seulement quand le départ et l'arrivée sont remplis
    function searchSmart() {
        const depart = document.getElementById('depart').value.trim();
        const arrivee = document.getElementById('arrivee').value.trim();
        document.getElementById('btn-search').disabled = !(depart && arrivee);
        document.getElementById('error').textContent = '';
        document.getElementById('depart').classList.remove('invalid');
        document.getElementById('arrivee').classList.remove('invalid');
    }

    function generateTicket() {
        const departInput = document.getElementById('depart');
        const arriveeInput = document.getElementById('arrivee');
        const depart = cleanCity(departInput.value);
        const arrivee = cleanCity(arriveeInput.value);
        const date = document.getElementById('date').value;
        const heure = document.getElementById('heure').value;
        const confort = document.getElementById('confort').value;
        const error = document.getElementById('error');

        if (!depart || !arrivee) {
            error.textContent = "Entre le départ et l'arrivée, mon ami !";
            if (!depart) departInput.classList.add('invalid');
            if (!arrivee) arriveeInput.classList.add('invalid');
            return;
        }
        if (depart.toLowerCase() === arrivee.toLowerCase()) {
            error.textContent = "Le départ et l'arrivée sont identiques.";
            arriveeInput.classList.add('invalid');
            return;
        }
        if (!date) {
            error.textContent = 'Choisis une date.';
            return;
        }

        departInput.value = depart;
        arriveeInput.value = arrivee;

        const result = document.getElementById('result');
        const loader = document.getElementById('loader');
        result.style.display = 'none';
        loader.style.display = 'block';

        setTimeout(() => {
            const dateText = new Date(date + 'T' + (heure || '00:00')).toLocaleDateString('fr-FR', {
                weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
            });

            document.getElementById('res-depart').textContent = depart;
            document.getElementById('res-arrivee').textContent = arrivee;
            document.getElementById('res-date').textContent = dateText + (heure ? ' à partir de ' + heure.replace(':', 'h') : '');
            document.getElementById('res-type').textContent = confort;
            document.getElementById('res-temps').textContent = depart + ' → ' + arrivee;

            copyTrip(depart + ' → ' + arrivee + ', ' + dateText + (heure ? ' ' + heure : ''));

            loader.style.display = 'none';
            result.style.display = 'block';
        }, 600);
    }

    function copyTrip(text) {
        if (navigator.clipboard) {
            navigator.clipboard.writeText(text).catch(() => {});
        }
    }

    // Ouvre la page d'accueil de SNCF Connect (où se trouve la recherche) dans un nouvel onglet
    function openSncf() {
        window.open('https://www.sncf-connect.com/', '_blank', 'noopener');
    }

    function resetForm() {
        document.getElementById('depart').value = '';
        document.getElementById('arrivee').value = '';
        document.getElementById('result').style.display = 'none';
        searchSmart();
        document.getElementById('depart').focus();
    }
</script>

</body>
</html>
