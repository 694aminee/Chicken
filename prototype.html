<title>Chicken King</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Layout: phone-first ordering app, brand black ground, red for action, sticky category rail + bottom nav, bottom sheets for steps */
:root{
  --ink:#0d0c0c;        /* brand black ground */
  --panel:#1a1716;      /* raised surfaces */
  --line:#2e2927;       /* hairlines */
  --paper:#f6f1ec;      /* text */
  --muted:#a89d97;      /* secondary text */
  --red:#e3262f;        /* brand red, actions */
  --red-deep:#b5161f;
  --gold:#f5c518;       /* price stickers, like the menu board */
  --ok:#3ecf72;
  --f-display:"Anton","Impact","Arial Narrow Bold",sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-label:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--ink);color:var(--paper)}
body{font-family:var(--f-body);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.price{font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ink);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;padding-block:12px 10px}
.brand img{width:48px;height:48px;border-radius:50%;flex:none}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:24px;letter-spacing:.02em;margin:0;line-height:1;text-transform:uppercase}
.brand p{margin:3px 0 0;font-size:13px;color:var(--muted)}
.status.closed{border-color:var(--red);color:var(--red)}
.status{margin-left:auto;font-family:var(--f-label);font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:999px;border:1px solid var(--ok);color:var(--ok);white-space:nowrap}
.rail{display:flex;gap:8px;overflow-x:auto;padding-block:0 12px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 14px;font-family:var(--f-label);font-weight:700;font-size:15px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.chip[aria-current="true"]{background:var(--paper);color:var(--ink);border-color:var(--paper)}

/* menu */
main{padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
.sec{padding-top:22px;scroll-margin-top:130px}
.sec h2{font-family:var(--f-display);font-weight:400;font-size:30px;text-transform:uppercase;margin:0;line-height:1.05;letter-spacing:.01em}
.sec h2 span{color:var(--red)}
.sec .sub{margin:4px 0 12px;color:var(--muted);font-size:14px}
.list{display:grid;gap:10px}
.item{display:grid;grid-template-columns:92px 1fr;gap:14px;align-items:center;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px}
.item:active{transform:scale(.99)}
.thumb{width:92px;height:76px;border-radius:10px;background:var(--ink);display:grid;place-items:center;overflow:hidden;position:relative}
.thumb img{width:100%;height:100%;object-fit:contain;background:#fff}
.thumb .tag{font-family:var(--f-display);font-size:24px;line-height:.95;text-align:center;text-transform:uppercase;color:var(--paper)}
.thumb .tag small{display:block;font-size:12px;color:var(--red);letter-spacing:.05em}
.item .txt{min-width:0}
.item h3{margin:0;font-family:var(--f-label);font-weight:700;font-size:20px;letter-spacing:.02em;text-transform:uppercase;line-height:1.1}
.item p{margin:3px 0 6px;font-size:13.5px;color:var(--muted);line-height:1.3}
.sticker{display:inline-block;background:var(--gold);color:var(--ink);font-family:var(--f-label);font-weight:700;font-size:16px;padding:2px 8px;border-radius:6px}
.sticker.alt{background:transparent;color:var(--gold);border:1px solid var(--gold);margin-left:6px;font-size:14px}

/* info + patron */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.rows{display:grid;gap:0}
.rows div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.rows div:last-child{border-bottom:0}
.todo{color:var(--gold);font-size:13px}
.note{font-size:13px;color:var(--muted);margin:10px 0 0}

/* bottom bars */
.cartbar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:15;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.cartbar button{max-width:528px;margin:0 auto;display:flex;width:100%;align-items:center;gap:12px;background:var(--red);border:0;border-radius:14px;padding:14px 16px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.cartbar .n{background:var(--ink);color:var(--paper);border-radius:999px;min-width:28px;height:28px;display:grid;place-items:center;font-size:14px}
.cartbar .t{margin-left:auto}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:16;background:var(--ink);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{background:none;border:0;height:64px;font-family:var(--f-label);font-weight:700;font-size:14px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);display:grid;place-items:center;align-content:center;gap:4px}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="true"]{color:var(--paper)}
.nav button[aria-current="true"] svg{color:var(--red)}
.badge{background:var(--red);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;margin-left:4px}

/* sheets */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--ink);border:1px solid var(--line);border-bottom:0;width:100%;max-width:560px;max-height:92%;border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sh-head{display:flex;align-items:flex-start;gap:12px;padding:16px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.sh-head h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:26px;text-transform:uppercase;line-height:1.05}
.sh-head p{margin:4px 0 0;color:var(--muted);font-size:14px}
.x{margin-left:auto;flex:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font-size:20px;line-height:1}
.sh-body{overflow-y:auto;padding:6px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));flex:1}
.sh-foot{padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);display:flex;gap:10px;align-items:center}
.grp{padding-top:16px}
.grp-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:8px}
.grp-h b{font-family:var(--f-label);font-size:19px;text-transform:uppercase;letter-spacing:.03em}
.req{font-size:12px;font-family:var(--f-label);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);padding:2px 7px;border-radius:999px;white-space:nowrap}
.req.bad{color:var(--red);border-color:var(--red)}
.req.good{color:var(--ok);border-color:var(--ok)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 12px;font-size:15px;font-weight:500;display:flex;gap:6px;align-items:center}
.opt em{font-style:normal;color:var(--gold);font-size:13px;font-variant-numeric:tabular-nums}
.opt[aria-pressed="true"]{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.opt[aria-pressed="true"] em{color:var(--red-deep)}
.opt:disabled{opacity:.35;cursor:not-allowed}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;flex:none}
.qty button{width:40px;height:46px;background:none;border:0;font-size:22px}
.qty span{min-width:22px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.go{flex:1;background:var(--red);border:0;border-radius:12px;height:48px;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 14px}
.go:disabled{background:var(--line);color:var(--muted);cursor:not-allowed}
.ghost{background:none;border:1px solid var(--line);border-radius:12px;height:48px;padding:0 14px;font-weight:600}

/* cart lines */
.line{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:14px 0;border-bottom:1px solid var(--line)}
.line h4{margin:0;font-family:var(--f-label);font-size:18px;text-transform:uppercase;letter-spacing:.02em}
.line p{margin:2px 0 0;font-size:13px;color:var(--muted);line-height:1.35}
.line .lp{text-align:right;font-weight:700}
.line .ctl{grid-column:1/-1;display:flex;align-items:center;gap:10px}
.line .ctl .qty button{height:36px;width:36px}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:13px;padding:0}
.tot{display:flex;justify-content:space-between;padding:14px 0 4px;font-family:var(--f-label);font-size:22px;text-transform:uppercase}
.empty{text-align:center;color:var(--muted);padding:30px 0}

/* forms */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;margin-top:14px}
.seg button{border:0;background:none;border-radius:9px;height:40px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink)}
.field{display:grid;gap:5px;margin-top:12px}
.field label{font-size:13px;color:var(--muted);font-weight:600}
.field input{height:48px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--paper);padding:0 14px;font:inherit;font-size:16px;width:100%}
.field input[aria-invalid="true"]{border-color:var(--red)}
.err{color:#ff6b72;font-size:13px;min-height:0}
.pay{margin-top:16px;border:1px dashed var(--line);border-radius:12px;padding:12px;font-size:13.5px;color:var(--muted)}
.pay b{color:var(--paper)}

/* confirmation */
.done{text-align:center;padding:10px 0 6px}
.done .lbl{font-family:var(--f-label);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-size:15px}
.ticket{margin:10px auto;display:inline-block;background:var(--paper);color:var(--ink);border-radius:16px;padding:14px 30px 8px;font-family:var(--f-display);font-size:96px;line-height:1;font-variant-numeric:tabular-nums;position:relative}
.ticket::before,.ticket::after{content:"";position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:var(--ink);transform:translateY(-50%)}
.ticket::before{left:-9px}.ticket::after{right:-9px}
.steps{display:flex;justify-content:center;gap:6px;margin:14px 0 4px;flex-wrap:wrap}
.steps span{font-family:var(--f-label);font-size:14px;text-transform:uppercase;letter-spacing:.05em;padding:5px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.steps span.on{background:var(--ok);border-color:var(--ok);color:var(--ink)}

/* patron */
.ord{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--red);border-radius:12px;padding:12px;display:grid;gap:8px}
.ord[data-s="prep"]{border-left-color:var(--gold)}
.ord[data-s="ready"]{border-left-color:var(--ok)}
.ord-h{display:flex;align-items:center;gap:10px}
.ord-h .num{font-family:var(--f-display);font-size:34px;line-height:1}
.ord-h .who{min-width:0}
.ord-h .who b{display:block}
.ord-h .who small{color:var(--muted)}
.ord-h .amt{margin-left:auto;font-weight:700}
.ord ul{margin:0;padding-left:18px;font-size:14px;color:var(--paper)}
.ord ul small{color:var(--muted)}
.sbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sbtns button{height:38px;border-radius:9px;border:1px solid var(--line);background:none;font-size:13px;font-weight:600}
.sbtns button[aria-pressed="true"]{background:var(--paper);color:var(--ink)}
.demo{font-family:var(--f-label);text-transform:uppercase;letter-spacing:.06em;font-size:12px;color:var(--gold);border:1px solid var(--gold);border-radius:999px;padding:2px 8px}
.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--paper);color:var(--ink);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.4);white-space:nowrap}
</style>

/* ---------- menu view ---------- */
function thumb(i){
  if(i.img) return `<div class="thumb"><img src="${i.img}" alt=""></div>`;
  const [a,b]=i.tag||[i.n,""];
  return `<div class="thumb"><div class="tag">${esc(a)}<small>${esc(b)}</small></div></div>`;
}
function renderMenu(){
  $("#rail").innerHTML=MENU.map((c,k)=>`<button class="chip" type="button" data-c="${c.id}" aria-current="${k===0}">${esc(c.t)}</button>`).join("");

  }</div></section>`).join("");

document.addEventListener("click",e=>{
  const chip=e.target.closest(".chip");
  if(chip){showView("menu");document.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-current",c===chip));document.getElementById("s-"+chip.dataset.c).scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});return}
  const it=e.target.closest(".item");if(it){openItem(it.dataset.i);return}
  const nv=e.target.closest(".nav button");if(nv){showView(nv.dataset.v);return}
});
function showView(v){
  ["menu","info","orders","boss"].forEach(x=>$("#view-"+x).hidden=x!==v);
  document.querySelectorAll(".nav button").forEach(b=>b.setAttribute("aria-current",b.dataset.v===v));
  $("#rail").hidden=v!=="menu";

/* ---------- sheet ---------- */
function sheet(html){
  $("#layer").innerHTML=`<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  $("#scrim").addEventListener("click",e=>{if(e.target.id==="scrim")closeSheet()});
  document.body.style.overflow="hidden";
}
function closeSheet(){$("#layer").innerHTML="";document.body.style.overflow=""}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#scrim"))closeSheet()});

/* ---------- item customisation ---------- */
let cur=null;
function openItem(id){
  const it=ITEMS[id];
  const sel={};(it.o||[]).forEach(g=>sel[g.id]=g.def!==undefined?[g.def]:[]);
  cur={it,sel,q:1};drawItem();
}
const visible=(g,sel)=>!g.showIf||(sel[g.showIf[0]]||[]).includes(g.showIf[1]);
function unitPrice(it,sel){let p=it.p;(it.o||[]).forEach(g=>{if(visible(g,sel))(sel[g.id]||[]).forEach(k=>p+=g.choices[k].p)});return Math.round(p*100)/100}
function groupOk(g,sel){const n=(sel[g.id]||[]).length;return !visible(g,sel)||(n>=g.min&&n<=g.max)}
function drawItem(){
  const {it,sel,q}=cur;
  const groups=(it.o||[]).filter(g=>visible(g,sel));
  const ok=groups.every(g=>groupOk(g,sel));
  const body=groups.map(g=>{
    const n=sel[g.id].length;let badge;
    if(g.min>0){badge=n>=g.min?`<span class="req good">OK</span>`:`<span class="req bad">${g.min===g.max&&g.min>1?`Choisis ${g.min}`:"Obligatoire"}</span>`}
    else badge=`<span class="req">${g.hint||"Facultatif"}</span>`;
    return `<div class="grp"><div class="grp-h"><b>${esc(g.label)}</b>${badge}</div><div class="opts">${g.choices.map((c,k)=>{
      const on=sel[g.id].includes(k);const full=!on&&g.max>1&&n>=g.max;
      return `<button type="button" class="opt" data-g="${g.id}" data-k="${k}" aria-pressed="${on}" ${full?"disabled":""}>${esc(c.n)}${c.p?`<em>+${eur(c.p)}</em>`:""}</button>`}).join("")}</div></div>`}).join("");
  sheet(`<div class="sh-head"><div><h3>${esc(it.n)}</h3><p>${esc(it.d)}</p></div><button class="x" type="button" aria-label="Fermer" data-close>×</button></div>
  <div class="sh-body">${body||`<p class="note">Aucune option pour ce produit.</p>`}</div>
  <div class="sh-foot"><div class="qty"><button type="button" data-q="-1" aria-label="Moins">−</button><span>${q}</span><button type="button" data-q="1" aria-label="Plus">+</button></div>
  <button class="go price" type="button" id="addBtn" ${ok?"":"disabled"}>${ok?"Ajouter":"Complète tes choix"} · ${eur(unitPrice(it,sel)*q)}</button></div>`);
  const sb=$(".sh-body");
  $(".sheet").addEventListener("click",e=>{
    if(e.target.closest("[data-close]")){closeSheet();return}
    const o=e.target.closest(".opt");
    if(o){const g=it.o.find(x=>x.id===o.dataset.g),k=+o.dataset.k,a=sel[g.id];
      if(g.max===1){ if(a[0]===k&&g.min===0)sel[g.id]=[]; else sel[g.id]=[k]; if(g.id==="formule"&&k===0)sel.boisson=[]; }
      else{const i=a.indexOf(k);if(i>=0)a.splice(i,1);else if(a.length<g.max)a.push(k)}
      const top=sb.scrollTop;drawItem();$(".sh-body").scrollTop=top;return}
    const qb=e.target.closest("[data-q]");
    if(qb){cur.q=Math.max(1,Math.min(20,cur.q+ +qb.dataset.q));const top=sb.scrollTop;drawItem();$(".sh-body").scrollTop=top;return}
    if(e.target.closest("#addBtn")){addToCart();}
  });
}
function describe(it,sel){
  return (it.o||[]).filter(g=>visible(g,sel)&&sel[g.id].length).map(g=>{
    const names=sel[g.id].map(k=>g.choices[k].n);
    if(g.id==="formule")return names[0];
    return (g.id==="viande"||g.id==="compo"||g.id==="qte"||g.id==="taille"||g.id==="boisson")?names.join(", "):`${g.label} : ${names.join(", ")}`;
  }).join(" · ");
}
function addToCart(){
  const {it,sel,q}=cur;
  cart.push({id:it.id,n:it.n,sel:JSON.parse(JSON.stringify(sel)),desc:describe(it,sel),u:unitPrice(it,sel),q});
  saveCart();closeSheet();updateBar();toast(`${it.n} ajouté au panier`);
}

/* ---------- cart ---------- */
const cartCount=()=>cart.reduce((s,l)=>s+l.q,0);
const cartTotal=()=>Math.round(cart.reduce((s,l)=>s+l.u*l.q,0)*100)/100;
function updateBar(){
  const n=cartCount();$("#cartbar").hidden=n===0;$("#cartN").textContent=n;$("#cartT").textContent=eur(cartTotal());
}
$("#cartBtn").addEventListener("click",openCart);
function openCart(){
  if(!cart.length){closeSheet();return}
  sheet(`<div class="sh-head"><div><h3>Ton panier</h3><p>Retrait au comptoir</p></div><button class="x" type="button" aria-label="Fermer" data-close>×</button></div>
  <div class="sh-body">${cart.map((l,i)=>`<div class="line"><div><h4>${esc(l.n)}</h4><p>${esc(l.desc)||"&nbsp;"}</p></div><div class="lp price">${eur(l.u*l.q)}</div>
   <div class="ctl"><div class="qty"><button type="button" data-cq="${i}" data-d="-1" aria-label="Moins">−</button><span>${l.q}</span><button type="button" data-cq="${i}" data-d="1" aria-label="Plus">+</button></div><button class="link" type="button" data-rm="${i}">Retirer</button></div></div>`).join("")}
   <div class="tot"><span>Total</span><span class="price">${eur(cartTotal())}</span></div></div>
  <div class="sh-foot"><button class="go price" type="button" id="toCheckout">Commander · ${eur(cartTotal())}</button></div>`);
  $(".sheet").addEventListener("click",e=>{
    if(e.target.closest("[data-close]")){closeSheet();return}
    const b=e.target.closest("[data-cq]");if(b){const l=cart[+b.dataset.cq];l.q+= +b.dataset.d;if(l.q<1)cart.splice(+b.dataset.cq,1);saveCart();updateBar();openCart();return}
    const r=e.target.closest("[data-rm]");if(r){cart.splice(+r.dataset.rm,1);saveCart();updateBar();openCart();return}
    if(e.target.closest("#toCheckout"))openCheckout();
  });
}

/* ---------- checkout ---------- */
let mode=account?"compte":"invite";
function openCheckout(err={}){
  const v=store.get("ck_draft",{prenom:"",nom:"",tel:"",email:""});
  if(mode==="compte"&&account){Object.assign(v,account)}
  const acct = mode==="compte" && !account;
  sheet(`<div class="sh-head"><div><h3>Tes infos</h3><p>Pour qu'on t'appelle si besoin et qu'on te reconnaisse au comptoir.</p></div><button class="x" type="button" aria-label="Fermer" data-close>×</button></div>
  <div class="sh-body">
   <div class="seg" role="group" aria-label="Mode"><button type="button" data-m="invite" aria-pressed="${mode==="invite"}">Invité</button><button type="button" data-m="compte" aria-pressed="${mode==="compte"}">${account?"Mon compte":"Créer un compte"}</button></div>
   <form id="f" novalidate>
    <div class="field"><label for="prenom">Prénom</label><input id="prenom" autocomplete="given-name" value="${esc(v.prenom)}" aria-invalid="${!!err.prenom}"><span class="err">${err.prenom||""}</span></div>
    <div class="field"><label for="nom">Nom</label><input id="nom" autocomplete="family-name" value="${esc(v.nom)}" aria-invalid="${!!err.nom}"><span class="err">${err.nom||""}</span></div>
    <div class="field"><label for="tel">Téléphone</label><input id="tel" type="tel" inputmode="tel" autocomplete="tel" placeholder="06 12 34 56 78" value="${esc(v.tel)}" aria-invalid="${!!err.tel}"><span class="err">${err.tel||""}</span></div>
    ${acct?`<div class="field"><label for="email">E-mail</label><input id="email" type="email" autocomplete="email" value="${esc(v.email||"")}" aria-invalid="${!!err.email}"><span class="err">${err.email||""}</span></div>
    <div class="field"><label for="pw">Mot de passe</label><input id="pw" type="password" autocomplete="new-password" aria-invalid="${!!err.pw}"><span class="err">${err.pw||""}</span></div>`:""}
    ${mode==="compte"&&account?`<p class="note">Connecté : ${esc(account.email)} · <button class="link" type="button" id="logout">Se déconnecter</button></p>`:""}
    <div class="pay"><b>Retrait :</b> dès que possible<br><b>Paiement :</b> carte bancaire en ligne. Dans cette version d'essai, aucun paiement réel n'est effectué.</div>
   </form>
  </div>
  <div class="sh-foot"><button class="ghost" type="button" id="back">Panier</button><button class="go price" type="submit" form="f">Payer ${eur(cartTotal())}</button></div>`);
  $(".sheet").addEventListener("click",e=>{
    if(e.target.closest("[data-close]")){closeSheet();return}
    if(e.target.closest("#back")){openCart();return}
    const m=e.target.closest("[data-m]");if(m){keepDraft();mode=m.dataset.m;openCheckout();return}
    if(e.target.closest("#logout")){account=null;store.set("ck_account",null);mode="invite";openCheckout()}
  });
  $("#f").addEventListener("submit",e=>{e.preventDefault();submitOrder(acct)});
}
function keepDraft(){const g=id=>($("#"+id)||{}).value||"";store.set("ck_draft",{prenom:g("prenom"),nom:g("nom"),tel:g("tel"),email:g("email")})}
function submitOrder(acct){
  const g=id=>(($("#"+id)||{}).value||"").trim();
  const d={prenom:g("prenom"),nom:g("nom"),tel:g("tel").replace(/[\s.-]/g,""),email:g("email")};
  const err={};
  if(!d.prenom)err.prenom="Écris ton prénom.";
  if(!d.nom)err.nom="Écris ton nom.";
  if(!/^(0[1-9]\d{8}|\+33[1-9]\d{8})$/.test(d.tel))err.tel="Écris un numéro à 10 chiffres, par exemple 06 12 34 56 78.";
  if(acct){if(!/^\S+@\S+\.\S+$/.test(d.email))err.email="Écris une adresse e-mail valide.";if(g("pw").length<6)err.pw="6 caractères minimum.";}
  if(Object.keys(err).length){store.set("ck_draft",d);openCheckout(err);return}
  if(acct){account={prenom:d.prenom,nom:d.nom,tel:d.tel,email:d.email};store.set("ck_account",account)}
  store.set("ck_draft",d);
  const btn=$(".sh-foot .go");btn.disabled=true;btn.textContent="Paiement en cours…";
  setTimeout(()=>{
    const num=nextNumber();
    const o={num,day:today(),at:new Date().toISOString(),client:`${d.prenom} ${d.nom}`,tel:d.tel,lines:cart.map(l=>({n:l.n,desc:l.desc,q:l.q,u:l.u})),total:cartTotal(),s:"new"};
    orders.unshift(o);saveOrders();cart=[];saveCart();updateBar();showDone(o);
  },1200);
}
const today=()=>{const d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()};
function nextNumber(){const c=store.get("ck_counter",{day:"",n:0});if(c.day!==today()){c.day=today();c.n=0}c.n=c.n>=999?1:c.n+1;store.set("ck_counter",c);return c.n}
const SLAB={new:"Reçue",prep:"En préparation",ready:"Prête"};
function stepsHtml(s){const order=["new","prep","ready"];const i=order.indexOf(s);return `<div class="steps">${order.map((k,j)=>`<span class="${j<=i?"on":""}">${SLAB[k]}</span>`).join("")}</div>`}
function showDone(o){
  sheet(`<div class="sh-head"><div><h3>Merci ${esc(o.client.split(" ")[0])} !</h3><p>Paiement accepté · ${eur(o.total)}</p></div><button class="x" type="button" aria-label="Fermer" data-close>×</button></div>
  <div class="sh-body"><div class="done"><div class="lbl">Ton numéro de commande</div><div class="ticket">${o.num}</div><p class="note">Donne ce numéro au comptoir. On te prévient quand c'est prêt.</p>${stepsHtml(o.s)}</div></div>
  <div class="sh-foot"><button class="go" type="button" data-close>Retour au menu</button></div>`);
  $(".sheet").addEventListener("click",e=>{if(e.target.closest("[data-close]"))closeSheet()});
}

  const waiting=list.filter(o=>o.s!=="ready").length;
  $("#view-boss").innerHTML=`<section class="sec"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><h2>Commandes <span>du jour</span></h2><span class="demo">Démo</span></div>
  <p class="sub">${list.length} commande(s) · ${waiting} en attente. Dans la vraie version, cet écran sera sur ta tablette et recevra les commandes de tous les clients en direct.</p>
  <div class="list">${list.length?list.map((o,i)=>`<div class="ord" data-s="${o.s}"><div class="ord-h"><span class="num">${o.num}</span><div class="who"><b>${esc(o.client)}</b><small>${esc(o.tel)} · ${new Date(o.at).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}</small></div><span class="amt price">${eur(o.total)}</span></div>
   <ul>${o.lines.map(l=>`<li>${l.q} × ${esc(l.n)}${l.desc?`<br><small>${esc(l.desc)}</small>`:""}</li>`).join("")}</ul>
   <div class="sbtns">${["new","prep","ready"].map(s=>`<button type="button" data-os="${o.num}|${o.at}" data-s="${s}" aria-pressed="${o.s===s}">${SLAB[s]}</button>`).join("")}</div></div>`).join("")
   :`<div class="empty">Pas encore de commande aujourd'hui.<br>Passe une commande test depuis le menu pour la voir arriver ici.</div>`}</div></section>`;
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-os]");if(!b)return;const [n,at]=b.dataset.os.split("|");const o=orders.find(x=>String(x.num)===n&&x.at===at);if(o){o.s=b.dataset.s;saveOrders();renderBoss();toast(`Commande ${o.num} : ${SLAB[o.s]}`)}});

/* keep chips in sync with scroll */
const io=("IntersectionObserver" in window)?new IntersectionObserver(es=>{es.forEach(en=>{if(en.isIntersecting){const id=en.target.id.slice(2);document.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-current",c.dataset.c===id))}})},{rootMargin:"-140px 0px -65% 0px"}):null;

function setStatus(){const h=new Date().getHours();const open=h>=11&&h<23;const s=$("#status");s.textContent=open?"Ouvert":"Fermé";s.classList.toggle("closed",!open)}
setStatus();setInterval(setStatus,60000);
renderMenu();updateBar();
if(io)document.querySelectorAll(".sec").forEach(s=>io.observe(s));
</script>
